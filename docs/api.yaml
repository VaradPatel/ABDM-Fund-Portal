openapi: 3.0.3
info:
  title: ABDM NHA Grant Access API
  description: >
    Full API surface of the application: authentication, OTP, states/roles
    lookups, static document downloads, and PFMS expenditure reporting.
    All routes are prefixed with the server context path (see `servers`).
  version: "1.0.0"

servers:
  - url: http://localhost:8090/abdm/v1/api
    description: Local

tags:
  - name: Auth
  - name: User Approval
  - name: OTP
  - name: States & Roles
  - name: Downloads
  - name: PFMS Expenditure Report
  - name: Fund Breakup Report
  - name: Proposal

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------
  # Auth (LoginController)
  # ---------------------------------------------------------------------
  /login:
    post:
      tags: [Auth]
      summary: Login with email + RSA-encrypted password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid email/password or user not activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Error while logging in (e.g. decryption failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Requires a verified OTP transactionId (see /send-otp + /verify-otp) before calling this.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signup"
      responses:
        "200":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /encrypt:
    post:
      tags: [Auth]
      summary: RSA-encrypt a plaintext value
      description: Utility endpoint — used by the frontend to encrypt the password before calling /login or /signup.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Test"
      responses:
        "200":
          description: Encrypted value (returned inside SuccessResponse.message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /decrypt:
    post:
      tags: [Auth]
      summary: RSA-decrypt a value
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Test"
      responses:
        "200":
          description: Decrypted plaintext string
          content:
            application/json:
              schema:
                type: string

  /change-password:
    post:
      tags: [Auth]
      summary: Change password for the logged-in user (requires a verified OTP)
      description: >
        Requires a Bearer token identifying the current user (matched by
        email from the token). `mobile` must match the token user's mobile
        number, and `transactionId` must reference an OTP that is verified,
        not expired, and tied to the same `mobile`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: No user found / missing transactionId / invalid or unverified OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Change password failed / unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /forgot-password:
    post:
      tags: [Auth]
      summary: Reset password via a verified OTP (no login required)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: No user found / missing transactionId / invalid or unverified OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Change password failed / unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user-activate/{userId}/{status}:
    post:
      tags: [Auth]
      summary: Activate or deactivate a user
      description: Caller must be authenticated with the `NHA Admin` authority.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: path
          required: true
          description: Non-zero activates the user; 0 deactivates.
          schema:
            type: integer
      responses:
        "200":
          description: User activated/deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Caller lacks the NHA Admin authority
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user/logout:
    post:
      tags: [Auth]
      summary: Log out the current user (invalidates the token)
      parameters:
        - name: Authorization
          in: header
          required: true
          description: "Bearer token, e.g. `Bearer <jwt>`."
          schema:
            type: string
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /validate-token:
    get:
      tags: [Auth]
      summary: Validate a Bearer token
      parameters:
        - name: Authorization
          in: header
          required: true
          description: "Bearer token, e.g. `Bearer <jwt>`."
          schema:
            type: string
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Missing or invalid token

  /user-approval:
    post:
      tags: [User Approval]
      summary: Approve or reject a pending user's registration
      description: >
        On approval (`isApproved: true`), generates a login SMS with a
        default password (`Nha@123`) sent to the user's mobile number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApprovalRequest"
      responses:
        "200":
          description: User approval status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: User not found
          content:
            text/plain:
              schema:
                type: string
                example: "user not found"
        "500":
          description: Unexpected error while updating user approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /adm-user-management/{status}:
    get:
      tags: [User Approval]
      summary: List users pending or already processed by an NHA admin
      description: >
        `status = 0` returns users still awaiting admin action; any non-zero
        value returns users already processed by an admin.
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: >
            List of users. Note: on an internal error, this endpoint still
            returns HTTP 200 with an `Error` body instead of a 4xx/5xx status.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/UserRequest"
                  - $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------
  # OTP (OtpController)
  # ---------------------------------------------------------------------
  /send-otp:
    post:
      tags: [OTP]
      summary: Send an OTP to a mobile number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpGenerateRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResponseTo"
        "500":
          description: Failed to send OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /verify-otp:
    post:
      tags: [OTP]
      summary: Verify an OTP, optionally logging the user in
      description: >
        If `islogin` is true and verification succeeds, a user lookup by
        `contact` (mobile) is performed and a login token is returned instead
        of a plain success message.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: OTP verified (LoginResponse if islogin=true, else SuccessResponse)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginResponse"
                  - $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Incorrect OTP, or no user found for the given contact (when islogin=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error while verifying OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------
  # Downloads (OtpController) — static documents, no parameters
  # ---------------------------------------------------------------------
  /download/pmjay-implementation:
    get:
      tags: [Downloads]
      summary: Download the PMJAY Implementation PDF
      security: []
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /download/pmjay-adm:
    get:
      tags: [Downloads]
      summary: Download the PMJAY Administrative PDF
      security: []
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /download/frs:
    get:
      tags: [Downloads]
      summary: Download the FRS document (.docx)
      security: []
      responses:
        "200":
          description: Word document
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary

  /download/gia-calculation-steps:
    get:
      tags: [Downloads]
      summary: Download the GIA Calculation Steps document (.docx)
      security: []
      responses:
        "200":
          description: Word document
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------------
  # States & Roles (stateController)
  # ---------------------------------------------------------------------
  /all-states:
    get:
      tags: [States & Roles]
      summary: List all states/UTs
      description: Use this to build the `states` picker for the PFMS expenditure APIs.
      security: []
      responses:
        "200":
          description: All states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/States"

  /state/{id}:
    get:
      tags: [States & Roles]
      summary: Get a single state by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: State found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/States"
        "404":
          description: State not found

  /all-roles:
    get:
      tags: [States & Roles]
      summary: List all roles
      security: []
      responses:
        "200":
          description: All roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Roles"

  # ---------------------------------------------------------------------
  # PFMS Expenditure Report (PfmsExpenditureReportController)
  # ---------------------------------------------------------------------
  /pfms-expenditure/upload:
    post:
      tags: [PFMS Expenditure Report]
      summary: Upload a PFMS TSA Expenditure excel report for a given date
      description: >
        Parses the uploaded excel, resolves each row's state name against the
        states master table (tolerating known aliases/typos), and upserts one
        row per (reportDate, state). Re-uploading for the same date + state
        overwrites the existing values.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, date, financialYear, quarter]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PFMS TSA Expenditure excel file (.xls/.xlsx). Must contain columns State, Total Fund- Released, Total Success Expenditure by State, Balance.
                date:
                  type: string
                  format: date
                  description: Report date (ISO-8601, e.g. 2025-01-31). All rows in the file are saved against this single date.
                financialYear:
                  type: string
                  description: Financial year label, e.g. "2025-26".
                quarter:
                  type: string
                  description: One of Q1, Q2, Q3, Q4 (case-insensitive).
                  enum: [Q1, Q2, Q3, Q4]
      responses:
        "200":
          description: Upload succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation failed (missing fields, missing/unmatched columns, unmatched state names, missing tracked states)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pfms-expenditure/download-latest:
    get:
      tags: [PFMS Expenditure Report]
      summary: Download the most recently uploaded PFMS expenditure excel file
      responses:
        "200":
          description: The latest uploaded report file, as originally uploaded
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Validation failed (e.g. no report has been uploaded yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pfms-expenditure/summary:
    get:
      tags: [PFMS Expenditure Report]
      summary: Get day-by-day expenditure data for a date range, per state
      description: >
        Returns one entry per requested state, each containing a `data` array
        with one snapshot per calendar day between `startDate` and `endDate`
        (inclusive). If a state has no uploaded report for a given day, that
        day's snapshot still appears with `reportDate` set and the amount
        fields as `null`.
      parameters:
        - name: states
          in: query
          required: true
          description: >
            List of state IDs to include. Accepts either repeated params
            (`states=1&states=2`) or a comma-separated value (`states=1,2,3`).
            Pass **`0`** alone to mean "all states" (equivalent to enumerating
            every state ID from `/all-states`).
          schema:
            type: array
            items:
              type: integer
          example: [1, 2, 3]
        - name: startDate
          in: query
          required: true
          description: Start of the date range (inclusive), ISO-8601.
          schema:
            type: string
            format: date
          example: "2025-01-01"
        - name: endDate
          in: query
          required: false
          description: End of the date range (inclusive), ISO-8601. Defaults to `startDate` if omitted (single-day query). Must not be before `startDate`.
          schema:
            type: string
            format: date
          example: "2025-01-05"
        - name: financialYear
          in: query
          required: false
          description: Optional filter — only include reports matching this financial year, e.g. "2025-26".
          schema:
            type: string
        - name: quarter
          in: query
          required: false
          description: Optional filter — only include reports matching this quarter (Q1-Q4).
          schema:
            type: string
            enum: [Q1, Q2, Q3, Q4]
      responses:
        "200":
          description: Per-state, per-day expenditure data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateExpenditureSummary"
              example:
                - stateId: 1
                  stateName: "Andhra Pradesh"
                  data:
                    - reportDate: "2025-01-01"
                      totalFundReleased: 1000000
                      totalSuccessExpenditure: 400000
                      balance: 600000
                    - reportDate: "2025-01-02"
                      totalFundReleased: null
                      totalSuccessExpenditure: null
                      balance: null
        "400":
          description: Validation failed (e.g. missing states/startDate, endDate before startDate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pfms-expenditure/latest-two-days:
    get:
      tags: [PFMS Expenditure Report]
      summary: Get the most recent 2 report dates, per state or summed across states
      description: >
        Finds the 2 most recent distinct report dates present in the DB for
        the requested states, then returns a `data` array with one snapshot
        per date (most recent last).
        When `sumStates=true`, returns a single entry (`stateId: null`,
        `stateName: "ALL"`) whose `data` values are the sum of
        totalFundReleased / totalSuccessExpenditure / balance across all
        requested states for each of the 2 dates. When `sumStates=false`
        (default), returns one entry per state instead.
      parameters:
        - name: states
          in: query
          required: true
          description: >
            List of state IDs to include. Accepts either repeated params
            (`states=1&states=2`) or a comma-separated value (`states=1,2,3`).
            Pass **`0`** alone to mean "all states".
          schema:
            type: array
            items:
              type: integer
          example: [1, 2, 3]
        - name: sumStates
          in: query
          required: false
          description: If true, sum the amounts across all requested states for each of the 2 dates instead of returning per-state breakdowns.
          schema:
            type: boolean
            default: false
        - name: financialYear
          in: query
          required: false
          description: Optional filter — only include reports matching this financial year.
          schema:
            type: string
        - name: quarter
          in: query
          required: false
          description: Optional filter — only include reports matching this quarter (Q1-Q4).
          schema:
            type: string
            enum: [Q1, Q2, Q3, Q4]
      responses:
        "200":
          description: >
            Per-state (sumStates=false) or single summed entry
            (sumStates=true) for the latest 2 report dates. Empty array if no
            reports exist yet for the requested states.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateExpenditureSummary"
              examples:
                perState:
                  summary: sumStates=false
                  value:
                    - stateId: 1
                      stateName: "Andhra Pradesh"
                      data:
                        - reportDate: "2025-03-30"
                          totalFundReleased: 1000000
                          totalSuccessExpenditure: 400000
                          balance: 600000
                        - reportDate: "2025-03-31"
                          totalFundReleased: 1200000
                          totalSuccessExpenditure: 500000
                          balance: 700000
                summed:
                  summary: sumStates=true
                  value:
                    - stateId: null
                      stateName: "ALL"
                      data:
                        - reportDate: "2025-03-30"
                          totalFundReleased: 55000000
                          totalSuccessExpenditure: 21000000
                          balance: 34000000
                        - reportDate: "2025-03-31"
                          totalFundReleased: 57000000
                          totalSuccessExpenditure: 23000000
                          balance: 34000000
        "400":
          description: Validation failed (e.g. missing states)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------
  # Fund Breakup Report (FundBreakupReportController)
  # ---------------------------------------------------------------------
  /fund-breakup/upload:
    post:
      tags: [Fund Breakup Report]
      summary: Upload a Fund Breakup excel report for a given date
      description: >
        Parses the uploaded excel, resolves each row's state name against the
        states master table (tolerating known aliases/typos), and upserts one
        row per (reportDate, state). Re-uploading for the same date + state
        overwrites the existing values. The uploaded file itself is also
        stored, keyed by (reportDate, financialYear, quarter).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, date, financialYear, quarter]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    The Fund Breakup excel file (.xls/.xlsx). Must contain a
                    single header row with the columns State, Total Fund-
                    Released, Total Expenditure by State, Balance, HR
                    Released, HR Expenditure, HR Balance, IEC-CB Released,
                    IEC-CB Expenditure, IEC-CB Balance, Admin Released, Admin
                    Expenditure, Admin Balance.
                date:
                  type: string
                  format: date
                  description: Report date (ISO-8601, e.g. 2025-01-31). All rows in the file are saved against this single date.
                financialYear:
                  type: string
                  description: Financial year label, e.g. "2025-26".
                quarter:
                  type: string
                  description: One of Q1, Q2, Q3, Q4 (case-insensitive).
                  enum: [Q1, Q2, Q3, Q4]
      responses:
        "200":
          description: Upload succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation failed (missing fields, missing/unmatched columns, unmatched state names, missing/invalid amounts in a row)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /fund-breakup/download-latest:
    get:
      tags: [Fund Breakup Report]
      summary: Download the most recently uploaded Fund Breakup excel file
      responses:
        "200":
          description: The latest uploaded report file, as originally uploaded
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Validation failed (e.g. no report has been uploaded yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /fund-breakup/summary:
    get:
      tags: [Fund Breakup Report]
      summary: Get day-by-day fund breakup data for a date range, per state
      description: >
        Returns one entry per requested state, each containing a `data` array
        with one snapshot per calendar day between `startDate` and `endDate`
        (inclusive). If a state has no uploaded report for a given day, that
        day's snapshot still appears with `reportDate` set and the amount
        fields as `null`.
      parameters:
        - name: states
          in: query
          required: true
          description: >
            List of state IDs to include. Accepts either repeated params
            (`states=1&states=2`) or a comma-separated value (`states=1,2,3`).
            Pass **`0`** alone to mean "all states" (equivalent to enumerating
            every state ID from `/all-states`).
          schema:
            type: array
            items:
              type: integer
          example: [1, 2, 3]
        - name: startDate
          in: query
          required: true
          description: Start of the date range (inclusive), ISO-8601.
          schema:
            type: string
            format: date
          example: "2025-01-01"
        - name: endDate
          in: query
          required: false
          description: End of the date range (inclusive), ISO-8601. Defaults to `startDate` if omitted (single-day query). Must not be before `startDate`.
          schema:
            type: string
            format: date
          example: "2025-01-05"
        - name: financialYear
          in: query
          required: false
          description: Optional filter — only include reports matching this financial year, e.g. "2025-26".
          schema:
            type: string
        - name: quarter
          in: query
          required: false
          description: Optional filter — only include reports matching this quarter (Q1-Q4).
          schema:
            type: string
            enum: [Q1, Q2, Q3, Q4]
      responses:
        "200":
          description: Per-state, per-day fund breakup data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateFundBreakupSummary"
              example:
                - stateId: 1
                  stateName: "Andhra Pradesh"
                  data:
                    - reportDate: "2025-01-01"
                      totalFundReleased: 1000000
                      totalExpenditure: 400000
                      totalBalance: 600000
                      hrFundReleased: 300000
                      hrExpenditure: 120000
                      hrBalance: 180000
                      iecCbFundReleased: 200000
                      iecCbExpenditure: 80000
                      iecCbBalance: 120000
                      adminFundReleased: 500000
                      adminExpenditure: 200000
                      adminBalance: 300000
                    - reportDate: "2025-01-02"
                      totalFundReleased: null
                      totalExpenditure: null
                      totalBalance: null
                      hrFundReleased: null
                      hrExpenditure: null
                      hrBalance: null
                      iecCbFundReleased: null
                      iecCbExpenditure: null
                      iecCbBalance: null
                      adminFundReleased: null
                      adminExpenditure: null
                      adminBalance: null
        "400":
          description: Validation failed (e.g. missing states/startDate, endDate before startDate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /fund-breakup/latest-two-days:
    get:
      tags: [Fund Breakup Report]
      summary: Get the most recent 2 report dates, per state or summed across states
      description: >
        Finds the 2 most recent distinct report dates present in the DB for
        the requested states, then returns a `data` array with one snapshot
        per date (most recent last).
        When `sumStates=true`, returns a single entry (`stateId: null`,
        `stateName: "ALL"`) whose `data` values are the sum of all amount
        fields across all requested states for each of the 2 dates. When
        `sumStates=false` (default), returns one entry per state instead.
      parameters:
        - name: states
          in: query
          required: true
          description: >
            List of state IDs to include. Accepts either repeated params
            (`states=1&states=2`) or a comma-separated value (`states=1,2,3`).
            Pass **`0`** alone to mean "all states".
          schema:
            type: array
            items:
              type: integer
          example: [1, 2, 3]
        - name: sumStates
          in: query
          required: false
          description: If true, sum the amounts across all requested states for each of the 2 dates instead of returning per-state breakdowns.
          schema:
            type: boolean
            default: false
        - name: financialYear
          in: query
          required: false
          description: Optional filter — only include reports matching this financial year.
          schema:
            type: string
        - name: quarter
          in: query
          required: false
          description: Optional filter — only include reports matching this quarter (Q1-Q4).
          schema:
            type: string
            enum: [Q1, Q2, Q3, Q4]
      responses:
        "200":
          description: >
            Per-state (sumStates=false) or single summed entry
            (sumStates=true) for the latest 2 report dates. Empty array if no
            reports exist yet for the requested states.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateFundBreakupSummary"
              examples:
                perState:
                  summary: sumStates=false
                  value:
                    - stateId: 1
                      stateName: "Andhra Pradesh"
                      data:
                        - reportDate: "2025-03-30"
                          totalFundReleased: 1000000
                          totalExpenditure: 400000
                          totalBalance: 600000
                          hrFundReleased: 300000
                          hrExpenditure: 120000
                          hrBalance: 180000
                          iecCbFundReleased: 200000
                          iecCbExpenditure: 80000
                          iecCbBalance: 120000
                          adminFundReleased: 500000
                          adminExpenditure: 200000
                          adminBalance: 300000
                        - reportDate: "2025-03-31"
                          totalFundReleased: 1200000
                          totalExpenditure: 500000
                          totalBalance: 700000
                          hrFundReleased: 350000
                          hrExpenditure: 150000
                          hrBalance: 200000
                          iecCbFundReleased: 250000
                          iecCbExpenditure: 100000
                          iecCbBalance: 150000
                          adminFundReleased: 600000
                          adminExpenditure: 250000
                          adminBalance: 350000
                summed:
                  summary: sumStates=true
                  value:
                    - stateId: null
                      stateName: "ALL"
                      data:
                        - reportDate: "2025-03-30"
                          totalFundReleased: 55000000
                          totalExpenditure: 21000000
                          totalBalance: 34000000
                          hrFundReleased: 15000000
                          hrExpenditure: 6000000
                          hrBalance: 9000000
                          iecCbFundReleased: 10000000
                          iecCbExpenditure: 4000000
                          iecCbBalance: 6000000
                          adminFundReleased: 30000000
                          adminExpenditure: 11000000
                          adminBalance: 19000000
                        - reportDate: "2025-03-31"
                          totalFundReleased: 57000000
                          totalExpenditure: 23000000
                          totalBalance: 34000000
                          hrFundReleased: 15500000
                          hrExpenditure: 6500000
                          hrBalance: 9000000
                          iecCbFundReleased: 10500000
                          iecCbExpenditure: 4500000
                          iecCbBalance: 6000000
                          adminFundReleased: 31000000
                          adminExpenditure: 12000000
                          adminBalance: 19000000
        "400":
          description: Validation failed (e.g. missing states)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------
  # Proposal (ProposalController) — local-disk document submission
  # ---------------------------------------------------------------------
  /proposal/upload:
    post:
      tags: [Proposal]
      summary: Submit a state's proposal documents for a financial year/quarter/category
      description: >
        Requires a Bearer token — the submitting user's email is taken from
        the token, not from the request body. Each file field accepts
        multiple files and is optional, but at least one file across all
        fields should be attached. Allowed file extensions: pdf, xls, xlsx,
        doc, docx. Files are stored on local disk under
        `{proposal.upload-dir}/{requestId}/{heading}/`; if any file fails to
        store, already-written files for the request are cleaned up.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [state_id, financial_year, quarter, category_id, amount_requested]
              properties:
                state_id:
                  type: integer
                financial_year:
                  type: string
                  description: e.g. "2026-27"
                quarter:
                  type: string
                  enum: [Q1, Q2, Q3, Q4]
                category_id:
                  type: integer
                amount_requested:
                  type: number
                  format: decimal
                  description: Mandatory. Must be greater than 0.
                remarks:
                  type: string
                  description: Optional note from the state at submission time.
                ucFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Utilization Certificate files.
                reconcileFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Reconciliation files.
                fundAllocationFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Fund Allocation files.
                unspendBalanceFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Unspent Balance files.
                othersFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Any other supporting files.
      responses:
        "200":
          description: Proposal submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalUploadResponse"
        "400":
          description: Validation failed (e.g. empty file, disallowed extension, invalid file name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Upload failed (e.g. disk write error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposal/summary:
    get:
      tags: [Proposal]
      summary: Search submitted proposals
      description: >
        All filters are optional; omitting all of them returns every proposal.
        `state_id=0` is the "all states" sentinel - it behaves the same as
        omitting state_id entirely, rather than filtering for a literal
        state_id of 0.
      parameters:
        - name: state_id
          in: query
          required: false
          schema:
            type: integer
          description: Pass 0 (or omit) to include all states.
        - name: financial_year
          in: query
          required: false
          schema:
            type: string
        - name: quarter
          in: query
          required: false
          schema:
            type: string
            enum: [Q1, Q2, Q3, Q4]
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2, 3, 4]
          description: >
            1=Pending at state due to query raised, 2=Pending at NHA State
            Coord, 3=Accepted by NHA State Coord, 4=Rejected by NHA State
            Coord.
      responses:
        "200":
          description: Matching proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProposalResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposal/download/{fileId}:
    get:
      tags: [Proposal]
      summary: Download a single proposal file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File contents, streamed with a Content-Disposition attachment header
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposal/action:
    post:
      tags: [Proposal]
      summary: NHA State Coord accepts a proposal or raises a query
      description: >
        Only valid while the proposal's status is 2 (Pending at NHA State
        Coord). ACCEPT moves it to status 3 and clears remarks. RAISE_QUERY
        requires remarks and moves it to status 1 (Pending at state), where
        the state can then call /proposal/edit to address it and resubmit.
        The acting user's identity is taken from the Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalActionRequest"
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
        "400":
          description: >
            Validation failed (e.g. proposal not found, wrong status for this
            action, missing remarks for RAISE_QUERY)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposal/edit:
    post:
      tags: [Proposal]
      summary: State edits and resubmits a proposal a query was raised against
      description: >
        Only valid while the proposal's status is 1 (Pending at state due to
        query raised). quarter, category_id, amount_requested and remarks are
        all optional and only touch what's provided. This is a full file
        replace, not an append: every previously uploaded file for the
        proposal is deleted (disk + DB) and only the files attached to this
        call are kept. On success the proposal moves back to status 2
        (Pending at NHA State Coord). The acting user's identity is taken
        from the Bearer token.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id:
                  type: string
                quarter:
                  type: string
                  enum: [Q1, Q2, Q3, Q4]
                category_id:
                  type: integer
                amount_requested:
                  type: number
                  format: decimal
                  description: Optional. If provided, must be greater than 0.
                remarks:
                  type: string
                  description: Optional reply to the coord's query.
                ucFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                reconcileFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                fundAllocationFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                unspendBalanceFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                othersFiles:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Updated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
        "400":
          description: Validation failed (e.g. proposal not found, wrong status, bad file)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proposal/{requestId}/timeline:
    get:
      tags: [Proposal]
      summary: Full action timeline for a proposal
      description: >
        Ordered oldest-first. One entry per action ever taken on the
        proposal (SUBMITTED, ACCEPTED, QUERY_RAISED, EDITED_RESUBMITTED),
        each with who did it and when.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered list of workflow history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowHistoryEntry"
        "400":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          description: RSA-encrypted password (see POST /encrypt).

    LoginResponse:
      type: object
      properties:
        userId:
          type: integer
        email:
          type: string
        mobile:
          type: string
        name:
          type: string
        isNew:
          type: boolean
        token:
          type: string
          description: "JWT bearer token to use in `Authorization: Bearer <token>` for subsequent requests."

    Signup:
      type: object
      required: [stateId, email, mobile, name, roles, designation, gender, dob, transactionId]
      properties:
        stateId:
          type: array
          items:
            type: integer
        email:
          type: string
          format: email
        mobile:
          type: string
          description: 10-digit Indian mobile number, must start with 6-9.
          pattern: "^[6-9]\\d{9}$"
        name:
          type: string
          pattern: "^[a-zA-Z\\s]+$"
        roles:
          $ref: "#/components/schemas/Roles"
        designation:
          type: string
          pattern: "^[a-zA-Z\\s]+$"
        gender:
          type: string
        dob:
          type: string
          format: date
        transactionId:
          type: string
          description: Transaction ID of a verified OTP (see /send-otp + /verify-otp).

    Test:
      type: object
      properties:
        encrypt:
          type: string
          description: For /encrypt this is the plaintext to encrypt; for /decrypt this is the ciphertext to decrypt.

    ChangePassword:
      type: object
      required: [mobile, password]
      properties:
        transactionId:
          type: string
          description: Transaction ID of a verified OTP. Required unless `isNew` is true.
        mobile:
          type: string
        password:
          type: string
          description: New password.
        isNew:
          type: boolean

    OtpGenerateRequest:
      type: object
      required: [mobile]
      properties:
        mobile:
          type: string
        type:
          type: string
          description: Purpose of the OTP (e.g. login, signup, forgot-password) — check IOtp implementation for accepted values.

    OtpResponseTo:
      type: object
      properties:
        transactionId:
          type: string
        message:
          type: string
        sentOn:
          type: string

    VerifyOtpRequest:
      type: object
      required: [transactionId, contact, otp]
      properties:
        transactionId:
          type: string
        contact:
          type: string
          description: Mobile number the OTP was sent to.
        otp:
          type: string
        islogin:
          type: boolean
          description: If true and the OTP is valid, a LoginResponse (with token) is returned instead of a plain SuccessResponse.

    States:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Roles:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    PfmsExpenditureSnapshot:
      type: object
      description: Financial figures for a single state on a single report date. Amount fields are null for a date with no uploaded report.
      properties:
        reportDate:
          type: string
          format: date
        totalFundReleased:
          type: number
          nullable: true
        totalSuccessExpenditure:
          type: number
          nullable: true
        balance:
          type: number
          nullable: true

    StateExpenditureSummary:
      type: object
      properties:
        stateId:
          type: integer
          nullable: true
          description: Null only in the summed ("ALL") entry from /pfms-expenditure/latest-two-days.
        stateName:
          type: string
          description: State name, or "ALL" for the summed entry.
        data:
          type: array
          description: One snapshot per date, ordered oldest to newest.
          items:
            $ref: "#/components/schemas/PfmsExpenditureSnapshot"

    FundBreakupSnapshot:
      type: object
      description: >
        Fund breakup figures for a single state on a single report date,
        broken down into total / HR / IEC-CB / Admin heads. Amount fields
        are null for a date with no uploaded report.
      properties:
        reportDate:
          type: string
          format: date
        totalFundReleased:
          type: number
          nullable: true
        totalExpenditure:
          type: number
          nullable: true
        totalBalance:
          type: number
          nullable: true
        hrFundReleased:
          type: number
          nullable: true
        hrExpenditure:
          type: number
          nullable: true
        hrBalance:
          type: number
          nullable: true
        iecCbFundReleased:
          type: number
          nullable: true
        iecCbExpenditure:
          type: number
          nullable: true
        iecCbBalance:
          type: number
          nullable: true
        adminFundReleased:
          type: number
          nullable: true
        adminExpenditure:
          type: number
          nullable: true
        adminBalance:
          type: number
          nullable: true

    StateFundBreakupSummary:
      type: object
      properties:
        stateId:
          type: integer
          nullable: true
          description: Null only in the summed ("ALL") entry from /fund-breakup/latest-two-days.
        stateName:
          type: string
          description: State name, or "ALL" for the summed entry.
        data:
          type: array
          description: One snapshot per date, ordered oldest to newest.
          items:
            $ref: "#/components/schemas/FundBreakupSnapshot"

    SuccessResponse:
      type: object
      properties:
        message:
          type: string

    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string

    UserApprovalRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
        isApproved:
          type: boolean
        remarks:
          type: string

    UserRequest:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        mobile:
          type: string
        designation:
          type: string
        stateName:
          type: string
        roleName:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        isVerified:
          type: boolean
        isActivated:
          type: boolean

    ProposalUploadResponse:
      type: object
      properties:
        requestId:
          type: string
        message:
          type: string

    ProposalResponse:
      type: object
      properties:
        requestId:
          type: string
        stateId:
          type: integer
        financialYear:
          type: string
        quarter:
          type: string
        categoryId:
          type: integer
        amountRequested:
          type: number
          format: decimal
        statusId:
          type: integer
        statusLabel:
          type: string
        remarks:
          type: string
          nullable: true
          description: >
            The latest note on the proposal - either the coord's query
            (while status=1) or the state's reply. Null once accepted.
        files:
          type: object
          description: >
            Map of upload heading (UC, Reconcile, FundAllocation,
            UnspendBalance, Others) to the list of files stored under that
            heading.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ProposalFileInfo"

    ProposalFileInfo:
      type: object
      properties:
        id:
          type: integer
        fileName:
          type: string
        downloadUrl:
          type: string

    ProposalActionRequest:
      type: object
      required: [requestId, action]
      properties:
        requestId:
          type: string
        action:
          type: string
          enum: [ACCEPT, RAISE_QUERY]
        remarks:
          type: string
          description: Required when action is RAISE_QUERY.

    WorkflowHistoryEntry:
      type: object
      properties:
        action:
          type: string
          enum: [SUBMITTED, ACCEPTED, QUERY_RAISED, EDITED_RESUBMITTED]
        actionLabel:
          type: string
        userId:
          type: integer
        userName:
          type: string
        remarks:
          type: string
          nullable: true
        statusAfter:
          type: integer
        statusAfterLabel:
          type: string
        createdAt:
          type: string
          format: date-time
